<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>EA 2 – GamerZone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stylesheet.css">
</head>



<body>

  <header class="inicio">
    <div class="casa">
      <a href="#">HOME</a>
    </div>
    <div class="logo">
      <h2 class="titulo">Gamer<span>Zone</span></h2>
    </div>
    <nav>
      <a href="#" class="btn-hero">Inicio Sesion</a>
    </nav>
  </header>

  <section >
    <div class="formulario">
      <h3> Registro de usuario</h3>
    </div>
    <form>
      <div class="campo">
        <label>NOMBRE COMPLETO</label>
        <input type="text" id="nombre">
      </div>

      <div class="campo">
        <label>CORREO</label>
        <input type="email" id="email">
      </div>

      <div class="campo">
        <label>CONTRASEÑA</label>
        <input type="password" id="contrase">
      </div>

      <div class="campo">
        <label>CONFIRMAR CONTRASEÑA</label>
        <input type="password" id="confirmar">
      </div>

      <div class="campo">
        <label>TELEFONO (opcional)</label>
        <input type="tel" id="telefono">
      </div>
      </form>

    <p>TIPO DE GENEROS</p>

    <div class="generos">
        <form class="generos-checkboxes">
          <label><input type="checkbox" name="genero"> FICCIÓN</label>
          <label><input type="checkbox" name="genero"> TERROR</label>
          <label><input type="checkbox" name="genero"> MISTERIO</label>
          <label><input type="checkbox" name="genero"> HISTÓRICO</label>
          <label><input type="checkbox" name="genero"> FANTASÍA</label>
          <label><input type="checkbox" name="genero"> AVENTURA</label>
          <label><input type="checkbox" name="genero"> CIENCIA FICCIÓN</label>
          <label><input type="checkbox" name="genero"> BIOGRAFÍA</label>
          <label><input type="checkbox" name="genero"> ROMANCE</label>
        </form>
    </div>

    <div class="boton-registro">
      <button class="registro" id="btnRegistro">REGISTRAR</button>
    </div>


  </section>
  <script src="assets/script.js"></script>

</body>
</html>
